<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>SightSpeak — Every webpage, ready to listen and act</title>
    <link rel="stylesheet" href="vendor/reveal/dist/reveal.css?v=sightspeak" />
    <link rel="stylesheet" href="vendor/reveal/dist/theme/black.css?v=sightspeak" />
    <link rel="stylesheet" href="styles.css?v=sightspeak" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="slides.md?v=sightspeak"
          data-separator-notes="^Notes:"
          data-charset="utf-8"
        ></section>
      </div>
    </div>

    <script src="vendor/reveal/dist/reveal.js?v=sightspeak"></script>
    <script src="vendor/reveal/dist/plugin/markdown.js?v=sightspeak"></script>
    <script src="vendor/reveal/dist/plugin/notes.js?v=sightspeak"></script>
    <script>
      const viewport = {
        width: window.innerWidth,
        height: window.innerHeight,
      };

      Reveal.initialize({
        hash: true,
        controls: false,
        progress: true,
        slideNumber: "c/t",
        transition: "slide",
        backgroundTransition: "fade",
        transitionSpeed: "fast",
        navigationMode: "linear",
        width: viewport.width,
        height: viewport.height,
        margin: 0,
        plugins: [RevealMarkdown, RevealNotes],
      });

      window.addEventListener("resize", () => {
        Reveal.configure({
          width: window.innerWidth,
          height: window.innerHeight,
        });
      });
    </script>
  </body>
</html>
