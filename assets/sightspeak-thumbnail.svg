<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">SightSpeak project thumbnail</title>
  <desc id="desc">A dark blue project thumbnail showing the SightSpeak voice-to-webpage action flow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080f22"/>
      <stop offset="0.52" stop-color="#122044"/>
      <stop offset="1" stop-color="#251e50"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61f7ef"/>
      <stop offset="0.55" stop-color="#9b7bff"/>
      <stop offset="1" stop-color="#ff9e80"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b294f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1730" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#d9e4ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#000617" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 10 6 L 1 11 Z" fill="#9b7bff"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#background)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="1050" cy="128" r="260" fill="#9b7bff" opacity="0.09"/>
  <circle cx="74" cy="700" r="220" fill="#61f7ef" opacity="0.065"/>

  <g transform="translate(70 66)">
    <rect width="163" height="35" rx="17.5" fill="#61f7ef" fill-opacity="0.13" stroke="#61f7ef" stroke-opacity="0.6"/>
    <text x="81.5" y="23" text-anchor="middle" fill="#bffdf9" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">TEAM 404</text>
  </g>
  <g transform="translate(911 66)">
    <rect width="219" height="35" rx="17.5" fill="#9b7bff" fill-opacity="0.14" stroke="#bcaaff" stroke-opacity="0.62"/>
    <text x="109.5" y="23" text-anchor="middle" fill="#e3dbff" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">HACKATHON PROTOTYPE</text>
  </g>

  <text x="70" y="164" fill="#f5f7ff" font-family="Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-3">Sight<tspan fill="#61f7ef">Speak</tspan></text>
  <rect x="72" y="185" width="310" height="6" rx="3" fill="url(#accent)"/>
  <text x="70" y="239" fill="#c8d0eb" font-family="Helvetica, Arial, sans-serif" font-size="31" font-weight="400">Every webpage, ready to listen and act</text>

  <rect x="70" y="300" width="1060" height="333" rx="30" fill="#08132b" fill-opacity="0.45" stroke="#dce5ff" stroke-opacity="0.16"/>
  <text x="100" y="341" fill="#9eaad0" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.7">VOICE TO SAFE PAGE ACTION</text>

  <g filter="url(#shadow)">
    <rect x="100" y="374" width="205" height="206" rx="22" fill="url(#cardFill)" stroke="#61f7ef" stroke-opacity="0.85" stroke-width="2"/>
    <text x="124" y="411" fill="#a8fff8" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">USER VOICE</text>
    <g transform="translate(124 447)" filter="url(#glow)">
      <rect x="0" y="20" width="8" height="28" rx="4" fill="#61f7ef"/>
      <rect x="16" y="8" width="8" height="52" rx="4" fill="#61f7ef"/>
      <rect x="32" y="0" width="8" height="68" rx="4" fill="#9b7bff"/>
      <rect x="48" y="14" width="8" height="40" rx="4" fill="#61f7ef"/>
      <rect x="64" y="5" width="8" height="58" rx="4" fill="#ff9e80"/>
      <rect x="80" y="18" width="8" height="32" rx="4" fill="#61f7ef"/>
    </g>
    <text x="124" y="549" fill="#c8d0eb" font-family="Helvetica, Arial, sans-serif" font-size="20">Speak naturally</text>
  </g>

  <path d="M 312 477 H 329" fill="none" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="345" y="374" width="205" height="206" rx="22" fill="url(#cardFill)" stroke="#9b7bff" stroke-opacity="0.9" stroke-width="2"/>
    <text x="369" y="411" fill="#dcd3ff" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">GPT-LIVE 1</text>
    <g transform="translate(420 439)" fill="none" stroke="#bba8ff" stroke-width="5" stroke-linecap="round">
      <rect x="0" y="0" width="42" height="62" rx="21"/>
      <path d="M -14 40 C -14 73 56 73 56 40"/>
      <path d="M 21 74 V 96 M 2 96 H 40"/>
    </g>
    <text x="369" y="549" fill="#c8d0eb" font-family="Helvetica, Arial, sans-serif" font-size="20">Hears intent</text>
  </g>

  <path d="M 557 477 H 574" fill="none" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="590" y="374" width="205" height="206" rx="22" fill="url(#cardFill)" stroke="#ff9e80" stroke-opacity="0.9" stroke-width="2"/>
    <text x="614" y="411" fill="#ffd4c6" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">CONTEXT</text>
    <rect x="615" y="437" width="122" height="78" rx="10" fill="#101e3d" stroke="#ff9e80" stroke-opacity="0.55"/>
    <rect x="627" y="451" width="74" height="7" rx="3.5" fill="#9b7bff"/>
    <rect x="627" y="468" width="91" height="7" rx="3.5" fill="#61f7ef" fill-opacity="0.74"/>
    <rect x="627" y="485" width="56" height="7" rx="3.5" fill="#c8d0eb" fill-opacity="0.48"/>
    <text x="614" y="549" fill="#c8d0eb" font-family="Helvetica, Arial, sans-serif" font-size="20">Live DOM + Exa</text>
  </g>

  <path d="M 802 477 H 819" fill="none" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="835" y="374" width="205" height="206" rx="22" fill="url(#cardFill)" stroke="#61f7ef" stroke-opacity="0.84" stroke-width="2"/>
    <text x="859" y="411" fill="#a8fff8" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">PAGE-ACTION</text>
    <g transform="translate(860 438)">
      <rect width="132" height="82" rx="10" fill="#101e3d" stroke="#61f7ef" stroke-opacity="0.55"/>
      <rect x="14" y="16" width="47" height="8" rx="4" fill="#61f7ef"/>
      <rect x="14" y="34" width="91" height="8" rx="4" fill="#c8d0eb" fill-opacity="0.45"/>
      <rect x="14" y="52" width="67" height="16" rx="5" fill="#9b7bff"/>
      <path d="M 104 57 l 9 10 16 -24" fill="none" stroke="#61f7ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="859" y="549" fill="#c8d0eb" font-family="Helvetica, Arial, sans-serif" font-size="20">Acts with consent</text>
  </g>

  <g transform="translate(70 687)">
    <rect width="1060" height="63" rx="17" fill="#071022" fill-opacity="0.76" stroke="#dce5ff" stroke-opacity="0.13"/>
    <text x="28" y="39" fill="#8b9abd" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="0.6">GPT-Live 1</text>
    <text x="231" y="39" fill="#8b9abd" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="0.6">Responses</text>
    <text x="433" y="39" fill="#8b9abd" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="0.6">page-agent</text>
    <text x="668" y="39" fill="#8b9abd" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="0.6">Exa</text>
    <text x="824" y="39" fill="#8b9abd" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="0.6">WebRTC</text>
  </g>
</svg>
